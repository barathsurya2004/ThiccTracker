<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/icon-192.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="apple-touch-icon" sizes="167x167" href="/apple-touch-icon-167.png" />
  <link rel="apple-touch-icon" sizes="152x152" href="/apple-touch-icon-152.png" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Tonnage" />
  <meta name="application-name" content="Tonnage" />
  <meta name="theme-color" content="#0a0a0a" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Tonnage</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet" />
</head>

<body>
  <script>
    try {
      var t = localStorage.getItem('theme');
      if (t && t !== 'system') document.documentElement.setAttribute('data-theme', t);
      var an = localStorage.getItem('accent-name');
      var ah = localStorage.getItem('accent-hue');
      if (an && ah) {
        var isLime = an === 'Lime';
        var l = isLime ? '0.88' : '0.74', c = isLime ? '0.19' : '0.17';
        document.documentElement.style.setProperty('--accent', 'oklch(' + l + ' ' + c + ' ' + ah + ')');
        document.documentElement.style.setProperty('--accent-ink', isLime ? 'oklch(0.20 0.05 130)' : 'oklch(0.99 0.005 240)');
      }
    } catch(e) {}
  </script>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
